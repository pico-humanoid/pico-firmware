name: PICO desktop portable release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/pico_workbench/**'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
          - os: ubuntu-24.04
            platform: Ubuntu-24.04-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux GUI build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y python3-tk xvfb xauth cmake ninja-build openocd fonts-noto-cjk
      - name: Enable Ubuntu source archives for bundled OpenOCD
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
      - name: Install verified official ARM toolchain
        run: python tools/pico_workbench/ui/packaging/install_arm_toolchain.py "${{ runner.temp }}/pico-arm"
      - run: python -m pip install pyinstaller==6.22.3
      - name: Build Windows portable distribution
        if: runner.os == 'Windows'
        run: python tools/pico_workbench/ui/packaging/build_distribution.py --repo . --output dist
      - name: Build Ubuntu portable distribution with build/flash tools
        if: runner.os == 'Linux'
        run: python tools/pico_workbench/ui/packaging/build_distribution.py --repo . --output dist --linux-tools "$PICO_ARM_TOOLCHAIN"
      - name: Windows tests and frozen GUI smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s dist/PICO-Workbench-Windows-x64/project/ui/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/PICO-Workbench-Windows-x64/PICOCLI.exe self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ubuntu tests and frozen GUI smoke check
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m unittest discover -s dist/PICO-Workbench-Ubuntu-24.04-x86_64/project/ui/tests
          xvfb-run -a dist/PICO-Workbench-Ubuntu-24.04-x86_64/PICOCLI self-test
      - name: Validate relocated Ubuntu package and actual ARM firmware builds
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/pico_workbench/ui/packaging/validate_linux_package.py dist/PICO-Workbench-Ubuntu-24.04-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: PICO-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    # Branch pushes validate only; never replace a historical release.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: PICO-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified Windows and Ubuntu packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag=desktop-ci-${COMMIT:0:8}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --notes-file docs/desktop-workbench.md
          else
            gh release create "$tag" release-assets/* --target "$COMMIT" --title 'PICO 桌面工具 · CI验证构建' --notes-file docs/desktop-workbench.md
          fi
